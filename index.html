<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0e7"><title>My Recipe Companion</title><style>
:root{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26372b;background:#f5f0e7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#faf7f0;padding:24px max(18px,calc((100vw - 1050px)/2));border-bottom:1px solid #e5dfd3}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#76816e;font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,45px);margin:6px 0;color:#284c37}header p{margin:4px 0 0;color:#6d756c}.wrap{max-width:1050px;margin:auto;padding:20px 18px 80px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}.search{flex:1;min-width:180px}.field,select,textarea{background:white;border:1px solid #d7d9ce;border-radius:12px;padding:12px;width:100%;color:#26372b}.btn{border:0;border-radius:12px;padding:12px 16px;background:#315c43;color:white;font-weight:700}.btn.alt{background:#e2e9dd;color:#315c43}.btn.danger{background:#f5dedb;color:#8b3029}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.chip{border:1px solid #d2d8cd;border-radius:25px;padding:9px 14px;background:#fff;color:#45624d;white-space:nowrap}.chip.active{background:#315c43;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.tile{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px #26372b12;border:1px solid #e5e6dc;cursor:pointer;text-align:left}.photo{height:155px;background:linear-gradient(135deg,#dce5d2,#f3d9b5);display:grid;place-items:center;font-size:64px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.tile .info{padding:16px}.tile h3{font-family:Georgia,serif;font-size:21px;margin:5px 0 8px}.meta{color:#7a8278;font-size:13px}.empty{padding:55px 20px;text-align:center;background:#fff;border:1px dashed #c8d3c6;border-radius:20px;color:#647468}.empty h2{font-family:Georgia,serif;color:#315c43}.topline{display:flex;justify-content:space-between;align-items:center;margin:10px 0 20px;color:#687669}.panel{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 20px #26372b12}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.formgrid textarea{min-height:125px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.recipehead{display:flex;justify-content:space-between;gap:15px;align-items:start}.recipehead h2{font-family:Georgia,serif;font-size:32px;margin:5px 0}.recipephoto{height:240px;border-radius:14px;overflow:hidden;margin:18px 0;background:#e6e8d9;display:grid;place-items:center;font-size:90px}.recipephoto img{width:100%;height:100%;object-fit:cover}.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:28px}.cols h3{font-family:Georgia,serif;font-size:24px}.ingredient{padding:9px 0;border-bottom:1px solid #e8ece5}.step{padding:10px 0;white-space:pre-wrap;border-bottom:1px solid #e8ece5}.subtle{font-size:13px;color:#7a8278}.hidden{display:none!important}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#26372b;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:10}footer{text-align:center;font-size:12px;color:#879084;padding:30px}.heart{font-size:24px;border:0;background:transparent;color:#b44b50} @media(max-width:600px){.cols{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.recipehead h2{font-size:26px}.wrap{padding:16px 14px 70px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:115px}.tile .info{padding:11px}.tile h3{font-size:17px}.panel{padding:16px}}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Recipes"></head><body><header><div class="eyebrow">Your personal kitchen library</div><h1>My Recipe Companion 🍃</h1><p>Recipes worth making. Memories worth keeping.</p></header><main class="wrap"><section id="home"><div class="toolbar"><input id="search" class="field search" placeholder="Search your recipes…" aria-label="Search recipes"><button class="btn" id="add">+ Add recipe</button></div><div class="chips" id="filters"></div><div class="topline"><span id="count"></span><span><button class="btn alt" id="export">Backup</button> <button class="btn alt" id="import">Restore</button><input type="file" id="importFile" accept="application/json" hidden></span></div><div id="cards" class="grid"></div></section><section id="editor" class="hidden"><button class="btn alt" id="backEdit">← Cookbook</button><h2 id="editTitle">Add recipe</h2><form id="recipeForm" class="panel"><div class="formgrid"><div class="full"><label for="name">Recipe name *</label><input class="field" id="name" required maxlength="140"></div><div><label for="category">Category</label><select id="category"><option>Dinner</option><option>Breakfast</option><option>Lunch</option><option>Dessert</option><option>Side Dish</option><option>Snack</option><option>Drink</option><option>Other</option></select></div><div><label for="servings">Servings</label><input class="field" id="servings" type="number" min="1" step="1" value="4"></div><div><label for="prep">Prep time (minutes)</label><input class="field" id="prep" type="number" min="0" value="0"></div><div><label for="cook">Cook time (minutes)</label><input class="field" id="cook" type="number" min="0" value="0"></div><div class="full"><label for="ingredients">Ingredients * (one per line)</label><textarea id="ingredients" required placeholder="2 cups rice&#10;1 tbsp olive oil"></textarea></div><div class="full"><label for="instructions">Instructions * (one step per line)</label><textarea id="instructions" required placeholder="Preheat oven to 375°F.&#10;Mix ingredients together."></textarea></div><div class="full"><label for="notes">Notes</label><textarea id="notes" placeholder="Family tips, substitutions, or memories"></textarea></div><div class="full"><label for="photo">Photo (stored locally; smaller photos work best)</label><input class="field" id="photo" type="file" accept="image/*"><p class="subtle" id="photoStatus"></p></div></div><div class="actions"><button class="btn" type="submit">Save recipe</button><button class="btn alt" type="button" id="cancel">Cancel</button></div></form></section><section id="detail" class="hidden"><button class="btn alt" id="backDetail">← Cookbook</button><div class="panel" style="margin-top:16px"><div class="recipehead"><div><div class="eyebrow" id="detailCat"></div><h2 id="detailName"></h2><div class="meta" id="detailMeta"></div></div><button class="heart" id="favorite" aria-label="Toggle favorite">♡</button></div><div class="recipephoto" id="detailPhoto"></div><div class="toolbar"><button class="btn alt" id="editRecipe">Edit</button><button class="btn alt" id="printRecipe">Print</button><button class="btn danger" id="deleteRecipe">Delete</button></div><div class="cols"><div><h3>Ingredients</h3><div style="display:flex;align-items:center;gap:8px"><label for="scale" style="margin:0">Servings</label><input id="scale" class="field" style="width:85px" type="number" min="1" step="1"></div><p class="subtle">Quantities written as leading numbers scale automatically.</p><div id="detailIngredients"></div></div><div><h3>Instructions</h3><div id="detailInstructions"></div><h3>Notes</h3><p id="detailNotes" style="white-space:pre-wrap"></p></div></div></div></section></main><footer>Saved on this device • Export backups to keep your cookbook safe</footer><div id="toast" role="status"></div><script>
const DB='my-recipe-companion-v1', STORE='recipes';let db,recipes=[],current=null,editing=null,filter='All',photoData='';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function tx(mode){return db.transaction(STORE,mode).objectStore(STORE)}function request(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function load(){recipes=await request(tx('readonly').getAll());recipes.sort((a,b)=>(b.updated||0)-(a.updated||0));render()}async function put(r){await request(tx('readwrite').put(r));await load()}async function remove(id){await request(tx('readwrite').delete(id));await load()}function view(id){['home','editor','detail'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function render(){let categories=['All','Favorites',...new Set(recipes.map(r=>r.category))];$('filters').innerHTML=categories.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');let q=$('search').value.toLowerCase();let visible=recipes.filter(r=>(filter==='All'||(filter==='Favorites'?r.favorite:r.category===filter))&&[r.name,r.ingredients,r.notes,r.category].join(' ').toLowerCase().includes(q));$('count').textContent=`${visible.length} recipe${visible.length===1?'':'s'} • ${recipes.length} saved`;$('cards').innerHTML=visible.map(r=>`<button class="tile" data-id="${escapeHtml(r.id)}"><div class="photo">${r.photo?`<img src="${r.photo}" alt="">`:'🍲'}</div><div class="info"><div class="meta">${escapeHtml(r.category)} ${r.favorite?'♥':''}</div><h3>${escapeHtml(r.name)}</h3><div class="meta">${Number(r.prep||0)+Number(r.cook||0)} min · ${Number(r.servings)||4} servings</div></div></button>`).join('');if(!visible.length)$('cards').innerHTML='<div class="empty" style="grid-column:1/-1"><h2>Your cookbook is ready</h2><p>Add your first recipe to begin your collection.</p><button class="btn" id="emptyAdd">+ Add a recipe</button></div>'}function editor(r){editing=r?.id||null;photoData=r?.photo||'';$('editTitle').textContent=r?'Edit recipe':'Add recipe';for(let k of ['name','category','servings','prep','cook','ingredients','instructions','notes'])$(k).value=r?.[k]??({category:'Dinner',servings:4,prep:0,cook:0}[k]??'');$('photo').value='';$('photoStatus').textContent=photoData?'Existing photo will be kept unless replaced.':'';view('editor')}function scaled(s,ratio){return s.replace(/^\s*(\d+(?:\.\d+)?|\d+\/\d+|\d+\s+\d+\/\d+)/,m=>{let parts=m.trim().split(/\s+/);let n=parts.reduce((a,p)=>a+(p.includes('/')?p.split('/').map(Number).reduce((x,y)=>x/y):Number(p)),0)*ratio;return (Math.round(n*100)/100).toString()})}function detail(id){current=recipes.find(r=>r.id===id);if(!current)return;let r=current;$('detailCat').textContent=r.category;$('detailName').textContent=r.name;$('detailMeta').textContent=`${Number(r.prep||0)} min prep · ${Number(r.cook||0)} min cook · ${r.servings} servings`;$('favorite').textContent=r.favorite?'♥':'♡';$('detailPhoto').innerHTML=r.photo?`<img src="${r.photo}" alt="Recipe photo">`:'🍲';$('scale').value=r.servings;$('detailInstructions').innerHTML=r.instructions.split('\n').filter(Boolean).map((s,i)=>`<div class="step"><b>${i+1}.</b> ${escapeHtml(s)}</div>`).join('');$('detailNotes').textContent=r.notes||'No notes yet.';renderIngredients();view('detail')}function renderIngredients(){if(!current)return;let ratio=(Number($('scale').value)||current.servings)/current.servings;$('detailIngredients').innerHTML=current.ingredients.split('\n').filter(Boolean).map(s=>`<div class="ingredient">${escapeHtml(scaled(s,ratio))}</div>`).join('')}function backup(){let blob=new Blob([JSON.stringify({app:'My Recipe Companion',version:1,exported:new Date().toISOString(),recipes},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-recipe-companion-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function validate(r){return r&&typeof r.name==='string'&&typeof r.ingredients==='string'&&typeof r.instructions==='string'&&typeof r.id==='string'}
$('add').onclick=()=>editor();$('backEdit').onclick=$('cancel').onclick=$('backDetail').onclick=()=>view('home');$('search').oninput=render;$('filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('cards').onclick=e=>{let b=e.target.closest('[data-id]');if(b)detail(b.dataset.id);else if(e.target.id==='emptyAdd')editor()};$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>8e6){toast('Choose a photo smaller than 8 MB');return}let image=new Image();let url=URL.createObjectURL(f);try{await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});let max=1000,scale=Math.min(1,max/Math.max(image.width,image.height));let canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);photoData=canvas.toDataURL('image/jpeg',.75);$('photoStatus').textContent='Photo ready to save.'}catch{toast('Could not read photo')}finally{URL.revokeObjectURL(url)}};$('recipeForm').onsubmit=async e=>{e.preventDefault();let r=editing?recipes.find(x=>x.id===editing):null;let obj={id:editing||uid(),favorite:r?.favorite||false,created:r?.created||Date.now(),updated:Date.now(),photo:photoData};for(let k of ['name','category','servings','prep','cook','ingredients','instructions','notes'])obj[k]=$(k).value.trim();obj.servings=Math.max(1,Number(obj.servings)||4);obj.prep=Math.max(0,Number(obj.prep)||0);obj.cook=Math.max(0,Number(obj.cook)||0);try{await put(obj);detail(obj.id);toast('Recipe saved!')}catch(err){toast('Save failed. Try a smaller photo or export a backup.')}};$('favorite').onclick=async()=>{current.favorite=!current.favorite;current.updated=Date.now();await put(current);detail(current.id)};$('scale').oninput=renderIngredients;$('editRecipe').onclick=()=>editor(current);$('deleteRecipe').onclick=async()=>{if(confirm(`Delete “${current.name}”? This cannot be undone.`)){await remove(current.id);view('home');toast('Recipe deleted')}};$('printRecipe').onclick=()=>window.print();$('export').onclick=backup;$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.recipes)||!data.recipes.every(validate))throw Error('Invalid backup');if(!confirm(`Restore ${data.recipes.length} recipes? Matching recipe IDs will be replaced; other recipes will remain.`))return;for(let r of data.recipes)await request(tx('readwrite').put(r));await load();toast('Backup restored!')}catch(err){toast('Could not restore: invalid backup file')}finally{e.target.value=''}};let open=indexedDB.open(DB,1);open.onupgradeneeded=()=>{open.result.createObjectStore(STORE,{keyPath:'id'})};open.onsuccess=()=>{db=open.result;load()};open.onerror=()=>{$('cards').innerHTML='<div class="empty">Storage unavailable. Enable browser storage to save recipes.</div>'};
</script><script>if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.warn));</script><style>@media print{header,.toolbar,.chips,.topline,footer,#backDetail,#favorite,#scale,.subtle{display:none!important}body{background:white}.wrap{padding:0}.panel{box-shadow:none;padding:0}.recipephoto{height:140px}.cols{grid-template-columns:1fr 1fr}.recipehead h2{font-size:25px}}</style>
